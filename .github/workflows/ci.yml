name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic audit demo (stdlib only)
        run: python3 demo/audit_demo.py
      - name: Smoke — audit a client CSV end to end (the CLI product path)
        run: |
          python3 - <<'EOF'
          import random, sys, csv, subprocess
          sys.path.insert(0, 'demo')
          import audit_demo as ad
          rng = random.Random(ad.SEED)
          cases = ad.build_cases(rng, n_days=10)
          px, sig = cases['px'], cases['trap']['sig']
          with open('/tmp/trades.csv', 'w', newline='') as fh:
              w = csv.writer(fh)
              w.writerow(['entry_bar', 'exit_bar', 'direction', 'entry_price', 'exit_price'])
              for t, pos, _p in cases['trap']['booked']:
                  w.writerow([t, t + ad.HOLD, pos, px[t], px[t + ad.HOLD]])
          with open('/tmp/prices.csv', 'w', newline='') as fh:
              w = csv.writer(fh)
              w.writerow(['bar', 'price', 'signal'])
              for b in range(len(px)):
                  w.writerow([b, px[b], sig[b]])
          r = subprocess.run(['python3', 'demo/audit_demo.py', '--csv', '/tmp/trades.csv',
                              '--prices', '/tmp/prices.csv', '--spread', str(ad.HALF_SPREAD)],
                             capture_output=True, text=True)
          assert r.returncode == 0, r.stderr
          assert r.stdout.count('— **FAIL**') == 4 and r.stdout.count('— **WARN**') == 1, 'trap CSV: 4 FAIL (look-ahead/candela/costo/overlay) + 1 WARN (capturabilidad, alpha rapido no distinguible de look-ahead)'
          print('cli ok: 4 FAIL + 1 WARN fired on the trap CSV')
          EOF

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML deps + pytest (pinned to requirements-ml.txt, torch excluded)
        run: pip install numpy==2.5.4 lightgbm==4.7.0 scikit-learn==1.9.1 pytest
      - name: Run tests
        run: pytest tests/ -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import deps (tsdb + backtests)
        run: pip install psycopg2-binary orjson numpy lightgbm scikit-learn
      - name: Smoke — package import resolves (tsdb lives in microstructure/data)
        run: python3 -c "import sys; sys.path.insert(0,'.'); from microstructure.data import tsdb; print('tsdb ok')"
      - name: Smoke — features_ml CLI (fixed sys.path to ../data)
        run: python3 microstructure/model/features_ml.py --help > /dev/null
      - name: Smoke — backtest scripts import (module-level code only, main is guarded)
        run: python3 -c "import sys; sys.path.insert(0,'microstructure/model'); import backtest_walkforward, backtest_desglose; print('backtests ok')"
