name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic audit demo (stdlib only)
        run: python3 demo/audit_demo.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML deps + pytest
        run: pip install numpy lightgbm scikit-learn pytest
      - name: Run tests
        run: pytest tests/ -q
